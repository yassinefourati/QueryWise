# Live test stack: every supported engine plus a runner with all drivers. Test-only; never for real data.
# Start it with scripts/run_live_tests.ps1, which generates throwaway passwords into the process environment
# (nothing is written to disk) and requires -AcceptLicenses for SQL Server, the ODBC driver and Db2 Community.
# No database publishes a host port: everything talks over the internal "livetest" network.
x-admin: &admin ${QW_ADMIN_PASSWORD:?Run scripts/run_live_tests.ps1 (it generates test passwords)}
x-health: &health
  interval: 10s
  timeout: 10s
  retries: 60

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: *admin
      POSTGRES_DB: qw_complex_energy
    healthcheck: {<<: *health, test: ["CMD-SHELL", "pg_isready -U postgres -d qw_complex_energy"]}

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: *admin
      MYSQL_DATABASE: qw_complex_retail
    healthcheck: {<<: *health, test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]}

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: *admin
      MARIADB_DATABASE: qw_complex_freight
    healthcheck: {<<: *health, test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]}

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${QW_ACCEPT_LICENSES:?Pass -AcceptLicenses to accept the SQL Server Developer EULA}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *admin
    healthcheck: {<<: *health, test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]}

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: *admin
      APP_USER: QW_COMPLEX
      APP_USER_PASSWORD: *admin
    healthcheck: {<<: *health, retries: 90, test: ["CMD", "healthcheck.sh"]}

  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    privileged: true  # Required by the Db2 Community image.
    environment:
      LICENSE: ${QW_DB2_LICENSE:?Pass -AcceptLicenses to accept the Db2 Community Edition license}
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: *admin
      DBNAME: QWCMPLX
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "false"
      HADR_ENABLED: "false"
      QW_READER_PASSWORD: ${QW_READER_PASSWORD:?Run scripts/run_live_tests.ps1}
    volumes:
      # Db2 authenticates OS users: this post-setup script creates the read-only "qwreader" OS account.
      - ./scripts/live/db2-custom:/var/custom:ro
    healthcheck: {<<: *health, retries: 120, start_period: 120s, test: ["CMD-SHELL", "id qwreader && su - db2inst1 -c 'db2 connect to QWCMPLX' >/dev/null"]}

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: *admin
    healthcheck: {<<: *health, test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: *admin
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck: {<<: *health, test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]}

  # The backend + frontend under test, with every driver and all live sources pre-registered (secret-free registry;
  # reader credentials come from this process environment). Open http://localhost:8000 while the stack runs.
  app:
    build: &tools
      context: .
      dockerfile: Dockerfile.test
      args:
        ACCEPT_LICENSES: ${QW_ACCEPT_LICENSES_BUILD:-}
    image: querywise-live-tools:latest
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      QUERYWISE_STATE_DIR: /state
      QUERYWISE_ALLOWED_HOSTS: app
      QUERYWISE_SOURCES_FILE: scripts/live/sources.live.json
      QUERYWISE_READER_PASSWORD: ${QW_READER_PASSWORD}
      QUERYWISE_POSTGRES_URL: postgresql+psycopg://qw_app:${QW_READER_PASSWORD}@postgres:5432/qw_complex_energy
      QUERYWISE_MYSQL_URL: mysql+pymysql://qw_app:${QW_READER_PASSWORD}@mysql:3306/qw_complex_retail
      QUERYWISE_MARIADB_URL: mariadb+pymysql://qw_app:${QW_READER_PASSWORD}@mariadb:3306/qw_complex_freight
      QUERYWISE_SQLSERVER_URL: mssql+pyodbc://qw_app:${QW_READER_PASSWORD}@sqlserver:1433/qw_complex_clinic?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
      QUERYWISE_ORACLE_URL: oracle+oracledb://QW_READER:${QW_READER_PASSWORD}@oracle:1521/?service_name=FREEPDB1
      QUERYWISE_DB2_URL: ibm_db_sa://qwreader:${QW_READER_PASSWORD}@db2:50000/QWCMPLX
      QUERYWISE_MONGODB_URL: mongodb://qw_app:${QW_READER_PASSWORD}@mongodb:27017/?authSource=qw_complex_learning
      QUERYWISE_ELASTICSEARCH_URL: http://elasticsearch:9200
      # Optional: use your own model in the UI (empty = choose in Settings).
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
    volumes:
      - app-state:/state
      - pack-output:/app/pack/output:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck: {<<: *health, test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]}
    depends_on:
      postgres: {condition: service_healthy}
      mysql: {condition: service_healthy}
      mariadb: {condition: service_healthy}
      sqlserver: {condition: service_healthy}
      oracle: {condition: service_healthy}
      db2: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}

  # Standalone frontend: nginx serves dist/ and proxies /api/ to the backend. http://localhost:8080
  # (port 8081, internal only, serves dist/ without an API, like the hosted WASM demo).
  frontend:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck: {<<: *health, test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null && wget -qO- http://127.0.0.1:8081/ >/dev/null"]}
    depends_on:
      app: {condition: service_healthy}

  runner:
    build: *tools
    image: querywise-live-tools:latest
    command: ["bash", "scripts/live/run_all.sh"]
    environment:
      QW_LIVE: "1"
      QW_APP_URL: http://app:8000
      QW_FRONTEND_URL: http://frontend:8080
      QW_STATIC_URL: http://frontend:8081
      QW_ADMIN_PASSWORD: *admin
      QW_READER_PASSWORD: ${QW_READER_PASSWORD}
    volumes:
      - ./test-results:/results
      - pack-output:/app/pack/output
    depends_on:
      frontend: {condition: service_healthy}

volumes:
  app-state:
  pack-output:
