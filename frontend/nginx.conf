# Standalone frontend for Querywise: serves dist/ and proxies the API to the backend container.
# Used by compose.test.yaml (nginx-unprivileged: non-root, read-only root filesystem, /tmp for runtime files).
server_tokens off;

# 8080: full app — static UI + /api/ proxied to the backend (Host "app" is in QUERYWISE_ALLOWED_HOSTS).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # API responses keep the backend's own Cache-Control (no-store).
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host app;
        proxy_read_timeout 180s;
        client_max_body_size 64k;
    }
    # UI files revalidate on every load (cheap ETag check) so an updated app.js is never run from a stale cache.
    # add_header inside a location replaces the server-level ones, so they are repeated here.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

# 8081: static-only hosting (no API), like the hosted demo: the UI falls back to SQLite/WASM in the browser.
server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
